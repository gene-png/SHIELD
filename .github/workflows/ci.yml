name: ci

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield_dev_password
          POSTGRES_DB: shield
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U shield -d shield"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://shield:shield_dev_password@localhost:5432/shield
      FLASK_SECRET_KEY: ci-secret
      AI_MODE: fixture
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check shield scripts tests
      - name: migrate
        run: flask --app wsgi:app db upgrade
      - name: tests
        run: pytest -q

  zap-baseline:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: build & start
        run: |
          cp .env.example .env
          docker compose -f compose/docker-compose.yml up -d --build db keycloak app
          for i in {1..40}; do
            curl -fsS http://localhost:8000/healthz && break || sleep 5
          done
      - name: ZAP baseline
        run: docker compose -f compose/docker-compose.yml --profile security run --rm zap || true
      - uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: reports/zap/
          if-no-files-found: warn
