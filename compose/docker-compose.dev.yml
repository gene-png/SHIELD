# Dev overlay: hot reload for app, bind-mount the source tree for both
# app AND worker so iterating on shield/tasks.py doesn't require a
# rebuild on the worker side.
name: shield

services:
  app:
    command: ["flask", "--app", "wsgi:app", "run", "--host=0.0.0.0", "--port=8000", "--debug"]
    environment:
      FLASK_DEBUG: "1"
    volumes:
      - ..:/app:rw
      - artifacts:/app/artifacts

  worker:
    volumes:
      - ..:/app:rw
      - artifacts:/app/artifacts
